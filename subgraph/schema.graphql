# =============================================================================
# NatLangChain ILRM - TheGraph Schema
# =============================================================================
# Every entity below is populated only from events the deployed contracts emit
# (see subgraph.yaml) plus a few read-only eth_calls for values that are fixed
# once written (noted per field). Field comments name the source event.
#
# Conventions
# - Event-log entities (@entity(immutable: true)) use "<txHash>-<logIndex>" ids.
# - Dispute ids are the ILRM dispute id in decimal. The subgraph assumes one
#   ILRM deployment: AssetRegistry and L3Bridge events are linked to Dispute
#   by id, so disputes of another ILRM sharing the registry (for example
#   MultiPartyILRM) would collide.
# - Timestamps are block timestamps (seconds); *Block fields are block numbers.
# =============================================================================

# =============================================================================
# Contracts, ownership, roles and admin log (all data sources)
# =============================================================================

enum ContractKind {
  ILRM
  TREASURY
  ORACLE
  L3_BRIDGE
  ASSET_REGISTRY
}

"""
One indexed protocol contract: ownership (Ownable2Step), pause state (Pausable)
and the configuration values its events expose
"""
type ProtocolContract @entity(immutable: false) {
  "Contract address"
  id: ID!

  kind: ContractKind!

  "Owner (OwnershipTransferred); null until the first ownership event is indexed"
  owner: Bytes

  "Pending owner (OwnershipTransferStarted); cleared by OwnershipTransferred"
  pendingOwner: Bytes

  "Pause state (Paused/Unpaused); Oracle and AssetRegistry are not pausable"
  paused: Boolean!

  "ILRM: treasury allowed to fund stake subsidies (SubsidyTreasuryUpdated); null = disabled"
  subsidyTreasury: Bytes

  "ILRM: cap on a single initiator incentive (InitiatorIncentiveCapsUpdated, also emitted by the constructor)"
  maxIncentivePerDispute: BigInt

  "ILRM: cap on all initiator incentives paid in one incentive window (InitiatorIncentiveCapsUpdated)"
  maxIncentivePerWindow: BigInt

  "ILRM: initiator-incentive window in seconds (InitiatorIncentiveCapsUpdated)"
  incentiveWindow: BigInt

  "Treasury: ILRM allowed to draw subsidies (ILRMUpdated)"
  ilrm: Bytes

  "Treasury: maximum subsidy per dispute (CapsUpdated; null until the first update)"
  maxSubsidyPerDispute: BigInt

  "Treasury: maximum subsidy per participant per window (CapsUpdated)"
  maxSubsidyPerParticipant: BigInt

  "Treasury: rolling subsidy window in seconds (CapsUpdated)"
  subsidyWindowDuration: BigInt

  "L3Bridge: sequencer (SequencerUpdated; null until the first change)"
  sequencer: Bytes

  "L3Bridge: bridge status (BridgeStatusChanged)"
  bridgeStatus: L3BridgeStatus

  "Role holders on this contract"
  roles: [RoleMember!]! @derivedFrom(field: "contract")

  "Configuration, ownership, pause and fund-management log"
  adminEvents: [AdminEvent!]! @derivedFrom(field: "contract")

  createdAt: BigInt!
  updatedAt: BigInt!
}

enum Role {
  "Oracle operator (Oracle.OracleRegistered; revokeOracle emits no event, so revocations are not visible)"
  ORACLE_OPERATOR
  "ILRM allowed to freeze/unfreeze assets (AssetRegistry.ILRMAuthorizationChanged)"
  AUTHORIZED_ILRM
  "Account allowed to bridge disputes to L3 (L3Bridge.DisputeBridgerUpdated)"
  L3_DISPUTE_BRIDGER
  "Account allowed to relay settlement batches (L3Bridge.SettlementRelayerUpdated)"
  L3_SETTLEMENT_RELAYER
}

"""
Role membership of one account on one contract
"""
type RoleMember @entity(immutable: false) {
  "<contract>-<role>-<account>"
  id: ID!

  contract: ProtocolContract!
  role: Role!
  account: Bytes!
  active: Boolean!

  "Oracle operators only: registered public key hash"
  publicKeyHash: Bytes

  updatedAt: BigInt!
  updatedTx: Bytes!
}

"""
Low-volume configuration, role, ownership, pause and fund-management events,
kept as one uniform log so new admin events need no schema change
"""
type AdminEvent @entity(immutable: true) {
  "<txHash>-<logIndex>"
  id: ID!

  contract: ProtocolContract!

  "Solidity event name, e.g. SubsidyTreasuryUpdated"
  event: String!

  "Main address argument (new owner, new treasury, recipient, account, ...)"
  account: Bytes

  "Previous address where the event carries one"
  previousAccount: Bytes

  "Boolean argument (authorized, ...)"
  flag: Boolean

  "Amount argument (withdrawn or deposited amount, ...)"
  amount: BigInt

  "Other arguments, rendered as text"
  details: String

  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

# =============================================================================
# Disputes (ILRM)
# =============================================================================

enum DisputeState {
  "Initiator staked; waiting for the counterparty stake"
  INITIATED
  "Both sides staked"
  ACTIVE
  RESOLVED
}

enum DisputeOutcome {
  PENDING
  ACCEPTED_PROPOSAL
  TIMEOUT_WITH_BURN
  DEFAULT_LICENSE_APPLIED
}

"""
Core dispute entity tracking the full lifecycle
"""
type Dispute @entity(immutable: false) {
  "Dispute ID from contract"
  id: ID!

  "Dispute initiator"
  initiator: Party!

  "Dispute counterparty"
  counterparty: Party!

  "Initiator stake (ILRM.disputes() at initiation; fixed once staked)"
  initiatorStake: BigInt!

  "Counterparty stake (StakeDeposited), including any treasury subsidy"
  counterpartyStake: BigInt!

  "Treasury-funded part of the counterparty stake (StakeSubsidized)"
  stakeSubsidy: StakeSubsidy

  "Block timestamp when dispute was initiated"
  startTime: BigInt!

  "Block when dispute was initiated"
  startBlock: BigInt!

  "Evidence hash at initiation"
  initialEvidenceHash: Bytes!

  "Latest evidence hash (updated by counter-proposals sent directly to ILRM, see Counter.evidenceHash)"
  evidenceHash: Bytes!

  state: DisputeState!

  outcome: DisputeOutcome!

  "Whether initiator accepted the live proposal"
  initiatorAccepted: Boolean!

  "Whether counterparty accepted the live proposal"
  counterpartyAccepted: Boolean!

  "Counter-proposals so far (= current Oracle round)"
  counterCount: Int!

  "Proposals stored so far (including superseded ones)"
  proposalCount: Int!

  "Live proposal; null before the first proposal and after a counter-proposal or an Oracle reset (ProposalVoided) clears it"
  currentProposal: Proposal

  "Fallback license terms hash (ILRM.disputes() at initiation)"
  fallbackTermsHash: Bytes

  "Fallback license duration in seconds (ILRM.disputes() at initiation)"
  fallbackDuration: BigInt

  "Fallback royalty cap in basis points (ILRM.disputes() at initiation)"
  fallbackRoyaltyCap: BigInt

  "All proposals for this dispute"
  proposals: [Proposal!]! @derivedFrom(field: "dispute")

  "All counter-proposals"
  counters: [Counter!]! @derivedFrom(field: "dispute")

  "Stake amount burned on timeout (StakesBurned)"
  burnAmount: BigInt

  "Counter-proposal fees burned (ETH)"
  counterFeesBurned: BigInt!

  "Initiator incentive paid on top of the returned stake on non-participation (InitiatorIncentivePaid); below initiatorIncentiveUncapped (possibly 0) when a cap or the token reserves bound it"
  initiatorIncentive: BigInt

  "Uncapped initiator incentive (10% of the initiator stake) the payout was derived from (InitiatorIncentivePaid)"
  initiatorIncentiveUncapped: BigInt

  "Advisory Oracle requests ILRM could not make or that reverted (OracleRequestFailed)"
  oracleRequestFailureCount: Int!

  "Failed advisory Oracle requests"
  oracleRequestFailures: [OracleRequestFailure!]! @derivedFrom(field: "dispute")

  "Block timestamp of resolution"
  resolvedAt: BigInt

  "Block number of resolution"
  resolvedBlock: BigInt

  "Transaction hash of resolution"
  resolvedTx: Bytes

  "Assets frozen for this dispute (AssetRegistry.AssetsFrozen)"
  assetFreezes: [AssetFreeze!]! @derivedFrom(field: "dispute")

  "Oracle-side state (Oracle events)"
  oracle: OracleDispute @derivedFrom(field: "dispute")

  "L3 bridging record (L3Bridge.DisputeBridgedToL3)"
  l3: L3BridgedDispute @derivedFrom(field: "dispute")

  "Created timestamp"
  createdAt: BigInt!

  "Last updated timestamp"
  updatedAt: BigInt!
}

"""
Voluntary reconciliation request (ILRM.initiateVoluntaryRequest emits
DisputeInitiated with disputeId = type(uint256).max and creates no dispute)
"""
type VoluntaryRequest @entity(immutable: true) {
  "<txHash>-<logIndex>"
  id: ID!

  initiator: Party!
  counterparty: Party!
  evidenceHash: Bytes!

  "ETH fee burned; known only when the transaction called ILRM directly, else null"
  feeBurned: BigInt

  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}

"""
Party (participant) in the protocol
"""
type Party @entity(immutable: false) {
  "Address of the party"
  id: ID!

  "Disputes initiated by this party"
  initiatedDisputes: [Dispute!]! @derivedFrom(field: "initiator")

  "Disputes where this party is counterparty"
  counterpartyDisputes: [Dispute!]! @derivedFrom(field: "counterparty")

  "Assets registered by this party (transfers emit no event and are not reflected)"
  assets: [Asset!]! @derivedFrom(field: "owner")

  "Total disputes participated in"
  totalDisputes: Int!

  "Disputes resolved by accepted proposal"
  disputesResolved: Int!

  "Disputes timed out with burn"
  disputesTimedOut: Int!

  "Disputes resolved by default license (counterparty never staked)"
  disputesDefaulted: Int!

  "Own funds staked (counterparty stakes exclude the treasury subsidy)"
  totalStaked: BigInt!

  "Own share of timeout burns (pro rata to own funds when a subsidy co-staked)"
  totalBurned: BigInt!

  "ILRM harassment score (ILRM.HarassmentScoreUpdated)"
  harassmentScore: BigInt!

  "Treasury harassment score, 0-100 (Treasury.HarassmentScoreUpdated)"
  treasuryHarassmentScore: BigInt!

  "Treasury subsidies escrowed into this party's stakes (ILRM.StakeSubsidized)"
  totalSubsidiesReceived: BigInt!

  "Voluntary requests sent"
  voluntaryRequestsSent: Int!

  "First seen timestamp"
  firstSeen: BigInt!

  "Last active timestamp"
  lastActive: BigInt!
}

enum ProposalStatus {
  "Live proposal of the current round"
  LIVE
  "Replaced by a proposal relayed over it in the same round (ProposalSuperseded); NatLangChainOracle voids first instead (VOIDED)"
  SUPERSEDED
  "Voided by an Oracle owner reset (ProposalVoided); the round admits one replacement"
  VOIDED
  "Cleared by a counter-proposal"
  VOIDED_BY_COUNTER
  "Accepted by both parties"
  ACCEPTED
  "Still live when the dispute timed out"
  EXPIRED
}

"""
LLM proposal stored in ILRM (ProposalSubmitted)
"""
type Proposal @entity(immutable: false) {
  "<disputeId>-<index>"
  id: ID!

  "Parent dispute"
  dispute: Dispute!

  "0-based order of submission within the dispute"
  index: Int!

  "Oracle round (dispute counterCount when stored)"
  round: Int!

  "Proposal content"
  content: String!

  "keccak256(content), the hash Oracle and ILRM events use"
  proposalHash: Bytes!

  status: ProposalStatus!

  "Proposal that replaced this one in the same round"
  supersededBy: Proposal

  initiatorAccepted: Boolean!
  counterpartyAccepted: Boolean!

  "Transaction sender (the oracle operator account)"
  submitter: Bytes!

  "Block timestamp"
  timestamp: BigInt!

  blockNumber: BigInt!

  "Transaction hash"
  txHash: Bytes!
}

"""
Counter-proposal record (CounterProposed)
"""
type Counter @entity(immutable: true) {
  "<disputeId>-<counterNumber>"
  id: ID!

  "Parent dispute"
  dispute: Dispute!

  "Party who submitted counter"
  party: Party!

  "Counter number (1-3)"
  counterNumber: Int!

  "New evidence hash; decoded from calldata when the transaction called ILRM.counterPropose directly, else null"
  evidenceHash: Bytes

  "ETH fee burned: COUNTER_FEE_BASE * 2^(counterNumber - 1); any excess paid went to the ILRM treasury"
  feeBurned: BigInt!

  "Block timestamp"
  timestamp: BigInt!

  blockNumber: BigInt!

  "Transaction hash"
  txHash: Bytes!
}

"""
Token burn of dispute stakes on timeout (StakesBurned)
"""
type Burn @entity(immutable: true) {
  "<txHash>-<logIndex>"
  id: ID!

  dispute: Dispute!

  "Amount burned"
  amount: BigInt!

  "Block timestamp"
  timestamp: BigInt!

  "Transaction hash"
  txHash: Bytes!
}

enum ScoreSource {
  ILRM
  TREASURY
}

"""
Harassment score update (ILRM and Treasury keep separate scores)
"""
type HarassmentScore @entity(immutable: true) {
  "<txHash>-<logIndex>"
  id: ID!

  "Affected party"
  party: Party!

  "Contract that holds the score"
  source: ScoreSource!

  "Previous score"
  oldScore: BigInt!

  "New score"
  newScore: BigInt!

  "Block timestamp"
  timestamp: BigInt!

  "Transaction hash"
  txHash: Bytes!
}

"""
Advisory Oracle.requestProposal call that ILRM could not make (no code at the oracle) or that
reverted (OracleRequestFailed). The dispute is unaffected; the Oracle has no request for the round.
"""
type OracleRequestFailure @entity(immutable: true) {
  "<txHash>-<logIndex>"
  id: ID!

  dispute: Dispute!

  "Round (dispute counterCount) the request was for"
  round: BigInt!

  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}

# =============================================================================
# Stake subsidies (ILRM escrow + Treasury grants)
# =============================================================================

"""
Treasury-funded part of a counterparty stake, escrowed in ILRM (StakeSubsidized).
The funder is repaid its pro-rata share of the counterparty payout (SubsidyReturned).
"""
type StakeSubsidy @entity(immutable: false) {
  "Dispute id (at most one subsidy per dispute)"
  id: ID!

  dispute: Dispute!
  counterparty: Party!

  "Treasury that funded the subsidy"
  funder: Bytes!

  "Subsidized amount"
  amount: BigInt!

  "Repaid to the funder so far (in full on acceptance, net of its burn share on timeout)"
  amountReturned: BigInt!

  returns: [SubsidyReturn!]! @derivedFrom(field: "subsidy")

  timestamp: BigInt!
  txHash: Bytes!
}

"""
Repayment of a stake subsidy to its funder on resolution (SubsidyReturned)
"""
type SubsidyReturn @entity(immutable: true) {
  "<txHash>-<logIndex>"
  id: ID!

  subsidy: StakeSubsidy!
  dispute: Dispute!
  funder: Bytes!
  amount: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"""
Subsidy grant as recorded by the Treasury (Treasury.SubsidyFunded)
"""
type TreasurySubsidy @entity(immutable: true) {
  "<txHash>-<logIndex>"
  id: ID!

  treasury: Bytes!

  "Subsidized counterparty"
  participant: Party!

  disputeId: BigInt!

  "Linked ILRM dispute"
  dispute: Dispute

  amount: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"""
Funds received by the Treasury (Treasury.TreasuryReceived)
"""
type TreasuryDeposit @entity(immutable: true) {
  "<txHash>-<logIndex>"
  id: ID!

  treasury: Bytes!
  from: Bytes!

  "Token amount, or wei when isEth"
  amount: BigInt!

  "Unverified label: deposit() lets any depositor choose any text; depositBurn() uses \"burn\", plain ETH transfers \"eth\""
  reason: String!

  "Label \"eth\": plain ETH transfer (receive()). Label-based, so a token deposit() labelled \"eth\" also counts"
  isEth: Boolean!

  "Burn proceeds from the Treasury's ILRM: label \"burn\" sent by the ILRM of the latest ILRMUpdated, as depositBurn() (ILRM-only) does. A \"burn\" label from anyone else is an ordinary deposit"
  isBurn: Boolean!

  timestamp: BigInt!
  txHash: Bytes!
}

"""
Daily Treasury statistics
"""
type TreasuryMetric @entity(immutable: false) {
  "Day start timestamp"
  id: ID!

  date: BigInt!

  "Subsidies granted (SubsidyFunded)"
  totalSubsidies: BigInt!

  subsidyCount: Int!

  "Token inflows of every reason except \"eth\""
  totalReceived: BigInt!

  "Burn proceeds from the Treasury's ILRM (TreasuryDeposit.isBurn), included in totalReceived"
  totalBurnDeposits: BigInt!

  "Deposits counted in totalBurnDeposits"
  burnDepositCount: Int!

  "ETH received (reason \"eth\")"
  totalReceivedEth: BigInt!
}

# =============================================================================
# Oracle
# =============================================================================

"""
Oracle-side state of one dispute
"""
type OracleDispute @entity(immutable: false) {
  "Dispute id"
  id: ID!

  "Linked ILRM dispute"
  dispute: Dispute

  "Mirror of Oracle.pendingRequests: set by requests and resets, cleared by submissions and cancellations (ProposalRequestCancelled)"
  pending: Boolean!

  "Proposal requests (ProposalRequested)"
  requestCount: Int!

  "Pending requests withdrawn by the owner (ProposalRequestCancelled)"
  cancelCount: Int!

  "Time of the latest ProposalRequestCancelled"
  lastCancelledAt: BigInt

  lastRequestedAt: BigInt
  lastRequestEvidenceHash: Bytes

  "Bookkeeping: time of the request (or owner reset) still awaiting a proposal; null when none"
  openRequestAt: BigInt

  "Nonce the next operator signature must use"
  nextNonce: BigInt!

  "Latest round that received a proposal"
  currentRound: BigInt

  submissionCount: Int!
  resetCount: Int!

  "Bookkeeping: operator and transaction of the latest ProposalSubmittedToILRM"
  lastOperator: Bytes
  lastSubmissionTx: Bytes

  "Bookkeeping: latest reset, completed by ProposalRoundReopened in the same transaction"
  lastReset: OracleReset
  lastResetTx: Bytes

  rounds: [OracleRound!]! @derivedFrom(field: "oracleDispute")
  submissions: [OracleSubmission!]! @derivedFrom(field: "oracleDispute")
  resets: [OracleReset!]! @derivedFrom(field: "oracleDispute")

  updatedAt: BigInt!
}

"""
One negotiation round (dispute counterCount): at most one live proposal
"""
type OracleRound @entity(immutable: false) {
  "<disputeId>-<round>"
  id: ID!

  oracleDispute: OracleDispute!
  round: BigInt!

  "Live proposal hash; null while the round is open"
  proposalHash: Bytes

  filled: Boolean!

  "Times filled (more than once after an owner reset)"
  fillCount: Int!

  "Times re-opened by an owner reset (ProposalRoundReopened)"
  reopenCount: Int!

  currentSubmission: OracleSubmission

  lastFilledAt: BigInt
  lastReopenedAt: BigInt
}

"""
Proposal admitted by the Oracle (ProposalRoundFilled + ProposalSubmittedToILRM)
"""
type OracleSubmission @entity(immutable: false) {
  "<disputeId>-<round>-<nonce>"
  id: ID!

  oracleDispute: OracleDispute!
  round: OracleRound!
  proposalHash: Bytes!

  "Nonce the signature consumed"
  nonce: BigInt!

  "Oracle operator that submitted (ProposalSubmittedToILRM)"
  operator: Bytes!

  "Evidence hash signed over (DisputeProcessed)"
  evidenceHash: Bytes

  "Voided by an owner reset (ProposalRoundReopened)"
  voided: Boolean!

  "Seconds since the request (or owner reset) this proposal answered, when one was indexed"
  responseTime: BigInt

  timestamp: BigInt!
  txHash: Bytes!
}

"""
Owner reset of a live proposal (ProposalReset + ProposalRoundReopened)
"""
type OracleReset @entity(immutable: false) {
  "<txHash>-<logIndex>"
  id: ID!

  oracleDispute: OracleDispute!

  "Round re-opened (ProposalRoundReopened); null if that event was not seen"
  round: BigInt

  voidedProposalHash: Bytes!
  reason: String!
  timestamp: BigInt!
  txHash: Bytes!
}

"""
Daily Oracle statistics
"""
type OracleMetric @entity(immutable: false) {
  "Day start timestamp"
  id: ID!

  date: BigInt!
  proposalsRequested: Int!
  requestsCancelled: Int!
  proposalsSubmitted: Int!
  proposalsReset: Int!

  "Mean OracleSubmission.responseTime (seconds) for the day: totalResponseSeconds / responseSamples, rounded down"
  avgResponseSeconds: BigInt!

  "Sum of the day's OracleSubmission.responseTime values"
  totalResponseSeconds: BigInt!

  "Submissions included in avgResponseSeconds"
  responseSamples: Int!
}

# =============================================================================
# L3 Bridge
# =============================================================================

enum L3BridgeStatus {
  ACTIVE
  PAUSED
  DEPRECATED
}

enum L3CommitmentStatus {
  "Committed and canonical, not finalized"
  PENDING
  FINALIZED
  "Rejected by a successful fraud proof"
  REJECTED
  "Descendant of a rejected root; can never finalize"
  ORPHANED
}

"""
Chain-tracking state of one L3Bridge (mirrors its committed/finalized heads)
"""
type L3Chain @entity(immutable: false) {
  "Bridge address"
  id: ID!

  latestCommittedRoot: Bytes
  latestCommittedHeight: BigInt!
  latestFinalizedRoot: Bytes
  latestFinalizedHeight: BigInt!
  latestFinalizedL3Block: BigInt!

  totalCommitments: BigInt!
  totalBridgedDisputes: BigInt!
  totalSettlements: BigInt!
}

"""
Canonical root at a chain height (bookkeeping for orphaning descendants on rollback)
"""
type L3ChainSlot @entity(immutable: false) {
  "<bridge>-<height>"
  id: ID!

  root: Bytes!
}

"""
L3 state commitment (StateCommitmentSubmitted)
"""
type L3StateCommitment @entity(immutable: false) {
  "State root"
  id: ID!

  bridge: Bytes!
  stateRoot: Bytes!

  "L3 block number"
  l3BlockNumber: BigInt!

  "Disputes in the batch"
  disputeCount: BigInt!

  sequencer: Bytes!

  "1-based chain height"
  height: BigInt!

  "Parent root (committed head, or finalized head when none is pending)"
  previousRoot: Bytes

  "Timestamp from which the root may be finalized (L3Bridge.getChallengeDeadline at submission)"
  challengeDeadline: BigInt

  status: L3CommitmentStatus!

  submittedAt: BigInt!
  submittedBlock: BigInt!
  txHash: Bytes!

  finalizedAt: BigInt

  "When the root was rejected or orphaned"
  invalidatedAt: BigInt

  "Successful fraud proof (REJECTED roots only)"
  challenge: FraudProofChallenge

  "Bookkeeping: latest reveal against this root, linked to FraudProofValidated in the same transaction"
  lastRevealCommitment: FraudProofCommitment
  lastRevealTx: Bytes

  fraudProofCommitments: [FraudProofCommitment!]! @derivedFrom(field: "stateCommitment")
}

enum FraudProofCommitmentStatus {
  "Bond escrowed, awaiting reveal"
  PENDING
  "Valid proof rejected the root: bond + reward paid"
  WON
  "Valid proof, but the root was already rejected or orphaned: bond returned"
  REFUNDED
  "Invalid or mismatched proof, or never revealed: bond kept by the bridge"
  FORFEITED
}

"""
Bonded fraud-proof commitment (commit-reveal)
"""
type FraudProofCommitment @entity(immutable: false) {
  "<challenger>-<commitHash>"
  id: ID!

  commitHash: Bytes!
  stateCommitment: L3StateCommitment!
  challenger: Bytes!
  bond: BigInt!
  status: FraudProofCommitmentStatus!

  "Reward paid on WON"
  reward: BigInt

  committedAt: BigInt!
  revealedAt: BigInt
  resolvedAt: BigInt
  commitTx: Bytes!
  resolveTx: Bytes
}

enum FraudProofMode {
  "commitFraudProof + revealFraudProof"
  COMMIT_REVEAL
  "Legacy submitFraudProof (only while commit-reveal is disabled)"
  DIRECT
}

"""
Successful fraud proof: one per rejected root
"""
type FraudProofChallenge @entity(immutable: false) {
  "Rejected state root"
  id: ID!

  stateCommitment: L3StateCommitment!
  challenger: Bytes!

  "Affected dispute named in the proof"
  disputeId: BigInt!

  mode: FraudProofMode!

  "Winning commitment (COMMIT_REVEAL only)"
  commitment: FraudProofCommitment

  "Reward paid (FraudProofValidated)"
  reward: BigInt

  "Committed head after the rollback (CommittedChainRolledBack)"
  newHead: Bytes
  newHeight: BigInt

  "Descendants orphaned by the rollback"
  orphanedCount: Int!

  timestamp: BigInt!
  txHash: Bytes!
}

enum L3DisputeState {
  PENDING
  ACTIVE
  PROPOSAL_SUBMITTED
  ACCEPTED
  TIMED_OUT
  SETTLED
}

"""
Dispute bridged to L3 (DisputeBridgedToL3 / DisputeSettledFromL3)
"""
type L3BridgedDispute @entity(immutable: false) {
  "L2 (ILRM) dispute id"
  id: ID!

  "Linked ILRM dispute"
  dispute: Dispute

  l3DisputeId: BigInt!
  initiator: Bytes!
  stakeAmount: BigInt!
  bridgedAt: BigInt!
  bridgeTx: Bytes!

  "Re-bridge attempts skipped by bridgeDisputeBatchToL3 (DisputeBridgeSkipped)"
  skippedRebridges: Int!

  "Settlements for this dispute skipped by batchProcessSettlements (SettlementSkipped)"
  skippedSettlements: Int!

  "Skipped settlement messages for this dispute"
  settlementSkips: [L3SettlementSkip!]! @derivedFrom(field: "bridgedDispute")

  settled: Boolean!
  outcome: L3DisputeState
  initiatorReturn: BigInt
  counterpartyReturn: BigInt
  settledAt: BigInt
  settlementTx: Bytes
}

enum L3SettlementSkipReason {
  "The L2 dispute was never bridged"
  NOT_BRIDGED
  "l3DisputeId is not the bridged dispute's L3 id"
  L3_DISPUTE_ID_MISMATCH
  "Already settled, including earlier in the same batch"
  ALREADY_SETTLED
  "Nonzero stateProof that is not a finalized root"
  STATE_ROOT_NOT_FINALIZED
  "A reason code this subgraph does not know (see reasonCode)"
  UNKNOWN
}

"""
Settlement message skipped by batchProcessSettlements instead of reverting the batch (SettlementSkipped)
"""
type L3SettlementSkip @entity(immutable: true) {
  "<txHash>-<logIndex>"
  id: ID!

  bridge: Bytes!

  "L2 (ILRM) dispute id named in the message"
  l2DisputeId: BigInt!

  "L3 dispute id named in the message"
  l3DisputeId: BigInt!

  reason: L3SettlementSkipReason!

  "IL3Bridge.SettlementSkipReason value as emitted"
  reasonCode: Int!

  "Bridged dispute with that L2 id; null for NOT_BRIDGED"
  bridgedDispute: L3BridgedDispute

  "Linked ILRM dispute (by L2 id)"
  dispute: Dispute

  timestamp: BigInt!
  blockNumber: BigInt!
  txHash: Bytes!
}

"""
Daily L3 statistics
"""
type L3Metric @entity(immutable: false) {
  "Day start timestamp"
  id: ID!

  date: BigInt!
  commitmentsSubmitted: Int!
  commitmentsFinalized: Int!
  commitmentsRejected: Int!
  commitmentsOrphaned: Int!

  "Disputes in submitted commitments"
  totalDisputesCommitted: BigInt!

  fraudProofsCommitted: Int!
  fraudProofsWon: Int!
  fraudProofsRefunded: Int!
  fraudProofsForfeited: Int!
  bondsForfeited: BigInt!
  rewardsPaid: BigInt!
  disputesBridged: Int!
  disputesSettled: Int!

  "Settlement messages skipped by batchProcessSettlements (SettlementSkipped)"
  settlementsSkipped: Int!
}

# =============================================================================
# Asset Registry
# =============================================================================

"""
Registered IP asset
"""
type Asset @entity(immutable: false) {
  "Asset id (bytes32)"
  id: ID!

  "Registering owner (transferAsset emits no event, so later transfers are not reflected)"
  owner: Party!

  "Current license terms hash (registration, then FallbackLicenseApplied)"
  licenseTermsHash: Bytes!

  "Registration timestamp"
  registeredAt: BigInt!

  "Whether currently frozen"
  frozen: Boolean!

  "Dispute causing the current freeze"
  frozenByDispute: BigInt

  "Fallback licenses applied to this asset"
  fallbackLicenseCount: Int!

  "License grants"
  licenses: [License!]! @derivedFrom(field: "asset")

  "Freeze history"
  freezes: [AssetFreeze!]! @derivedFrom(field: "asset")
}

"""
License grant to one licensee (LicenseModified)
"""
type License @entity(immutable: false) {
  "<assetId>-<licensee>"
  id: ID!

  asset: Asset!
  licensee: Party!

  "Current terms hash (last grant)"
  termsHash: Bytes!

  "Registry's LicenseGrant.active; zero-terms grants and revokes (both LicenseModified(0, 0)) are classified by getLicense at the end of the block"
  active: Boolean!

  "Times granted or re-granted"
  grantCount: Int!

  "From AssetRegistry.getLicense at the end of the grant block"
  grantedAt: BigInt
  expiresAt: BigInt
  royaltyBps: BigInt
  nonExclusive: Boolean

  revokedAt: BigInt
  updatedTx: Bytes!
}

"""
Asset frozen for a dispute (AssetsFrozen / AssetsUnfrozen)
"""
type AssetFreeze @entity(immutable: false) {
  "<assetId>-<disputeId>"
  id: ID!

  asset: Asset!

  "Dispute ID causing freeze"
  disputeId: BigInt!

  "Linked ILRM dispute"
  dispute: Dispute

  "Party whose assets were frozen"
  party: Bytes!

  "Freeze timestamp"
  frozenAt: BigInt!

  "Unfreeze timestamp"
  unfrozenAt: BigInt

  "Transaction hash of the freeze"
  txHash: Bytes!
}

"""
Assets frozen by one dispute (bookkeeping for AssetsUnfrozen, which lists no assets)
"""
type DisputeAssetSet @entity(immutable: false) {
  "Dispute id"
  id: ID!

  assets: [Asset!]!

  "Resolution outcome passed to unfreezeAssets (proposal text or abi-encoded outcome)"
  unfreezeOutcome: Bytes
  unfrozenAt: BigInt
}

"""
Fallback license applied to a dispute's frozen assets (FallbackLicenseApplied)
"""
type FallbackLicenseApplication @entity(immutable: true) {
  "<txHash>-<logIndex>"
  id: ID!

  disputeId: BigInt!

  "Linked ILRM dispute"
  dispute: Dispute

  termsHash: Bytes!
  assets: [Asset!]!
  timestamp: BigInt!
  txHash: Bytes!
}

# =============================================================================
# Protocol Metrics (Aggregate)
# =============================================================================

"""
Daily protocol statistics
"""
type DailyMetric @entity(immutable: false) {
  "Day start timestamp"
  id: ID!

  date: BigInt!

  disputesInitiated: Int!
  disputesResolved: Int!
  disputesTimedOut: Int!
  disputesDefaulted: Int!

  "Stakes deposited (both sides, subsidies included)"
  totalStaked: BigInt!

  "Stake tokens burned on timeout"
  totalBurned: BigInt!

  "Stake subsidies escrowed (StakeSubsidized)"
  totalSubsidies: BigInt!

  "Stake subsidies repaid to funders (SubsidyReturned)"
  totalSubsidiesReturned: BigInt!

  "Initiator incentives paid on non-participation (InitiatorIncentivePaid)"
  initiatorIncentivesPaid: BigInt!

  "Parties whose first dispute was initiated this day"
  newParticipants: Int!

  counterProposals: Int!
  proposals: Int!
  voluntaryRequests: Int!

  "L3 state commitments submitted"
  l3Commitments: Int!
}

"""
Cumulative protocol statistics
"""
type ProtocolMetric @entity(immutable: false) {
  "Singleton ID: 'protocol'"
  id: ID!

  totalDisputes: BigInt!
  activeDisputes: BigInt!
  resolvedDisputes: BigInt!
  timedOutDisputes: BigInt!
  defaultedDisputes: BigInt!

  "Stakes deposited all time (both sides, subsidies included)"
  totalValueStaked: BigInt!

  "Stake tokens burned all time"
  totalValueBurned: BigInt!

  "Stake subsidies escrowed (StakeSubsidized)"
  totalSubsidiesDistributed: BigInt!

  "Stake subsidies repaid to funders (SubsidyReturned)"
  totalSubsidiesReturned: BigInt!

  "Initiator incentives paid on non-participation (InitiatorIncentivePaid amount)"
  totalInitiatorIncentivesPaid: BigInt!

  "Uncapped initiator incentives those payouts were derived from (InitiatorIncentivePaid uncappedAmount)"
  totalInitiatorIncentivesUncapped: BigInt!

  "Initiator incentives paid below the uncapped amount (a cap or the token reserves bound them)"
  cappedInitiatorIncentives: BigInt!

  "Advisory Oracle requests ILRM could not make or that reverted (OracleRequestFailed)"
  totalOracleRequestFailures: BigInt!

  "Addresses that took part in at least one dispute"
  uniqueParticipants: BigInt!

  totalProposals: BigInt!
  totalCounterProposals: BigInt!

  "Counter-proposal fees burned (ETH)"
  totalCounterFeesBurned: BigInt!

  totalVoluntaryRequests: BigInt!

  "L3 state commitments submitted"
  totalL3Commitments: BigInt!

  "Sum over resolved disputes of the blocks from initiation to resolution"
  totalResolutionBlocks: BigInt!

  "Mean blocks from initiation to resolution: totalResolutionBlocks / resolvedDisputes, rounded down"
  avgResolutionBlocks: BigInt!

  "Last updated block"
  lastUpdatedBlock: BigInt!
}
